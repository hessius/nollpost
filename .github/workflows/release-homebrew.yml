name: Release to Homebrew Tap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  publish-homebrew:
    name: Update Homebrew Tap Formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine release version
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch GitHub tag tarball SHA256 and render Formula/nollpost.rb
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p dist
          TARBALL="dist/nollpost-${TAG}.tar.gz"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL "$URL" -o "$TARBALL"
          python3 scripts/update_homebrew_formula.py \
            --version "${{ steps.meta.outputs.version }}" \
            --tarball "$TARBALL" \
            --url "$URL" \
            --output dist/nollpost.rb
          ruby -c dist/nollpost.rb

      - name: Ensure GitHub Release exists for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi

      - name: Push updated Formula/nollpost.rb to Hessius/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not configured; skipping automatic push to Hessius/homebrew-tap. Download nollpost.rb from workflow artifacts and push manually."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Hessius/homebrew-tap.git" tap-repo
          cp dist/nollpost.rb tap-repo/Formula/nollpost.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/nollpost.rb; then
            echo "Hessius/homebrew-tap Formula/nollpost.rb is already up to date for ${TAG}."
            exit 0
          fi
          git add Formula/nollpost.rb
          git commit -m "chore(nollpost): release ${TAG}"
          git push origin main

      - name: Upload rendered formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula-${{ steps.meta.outputs.tag }}
          path: dist/nollpost.rb
