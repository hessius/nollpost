<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nollpost: Morning Mail Triage</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header class="header-a">
      <div class="header-top">
        <div>
          <div class="brand-row">
            <svg class="brand-mark" viewBox="0 0 512 512" width="26" height="26" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="round">
                <path stroke-width="36" d="M 343.7 410.3 C 318.9 428.4 290.2 438 261 438 C 173.6 438 105 357.9 105 256 C 105 154.1 172.8 74 259 74 C 341.9 74 407 148.8 407 244 C 407 312 391 352 361 352 C 331 352 319 322 319 256" />
                <path stroke-width="36" d="M 255 160 C 292.1 160 319 197.4 319 256 C 319 314.6 292.1 352 255 352 C 217.9 352 191 314.6 191 256 C 191 197.4 217.9 160 255 160 Z" />
                <line stroke-width="26" x1="298.1" y1="182.2" x2="211.9" y2="329.8" />
              </g>
            </svg>
            <h1 id="board-title" data-i18n="board.title_default">Nollpost: Morning Mail Triage</h1>
          </div>
          <div class="tally-pills" id="tally-pills"></div>
        </div>
        <div class="header-controls">
          <div class="mode-switch">
            <button class="btn small active" id="mode-inbox" data-mode="inbox" data-i18n="mode.inbox" data-i18n-title="mode.inbox_title" title="Scan active INBOX folders across your Mail.app accounts">Daily Inbox</button>
            <button class="btn small" id="mode-catchup" data-mode="catchup" data-i18n="mode.catchup" data-i18n-title="mode.catchup_title" title="Find repeat newsletters in your Archive mailboxes so you can unsubscribe safely">Archive Catch-Up</button>
          </div>
          <label class="toggle-check" data-i18n-title="ctrl.show_browser_title" title="Show Chromium window while unsubscribing/declining">
            <input type="checkbox" id="show-browser-toggle" />
            <span data-i18n="ctrl.show_browser">Show Browser</span>
          </label>
          <button class="btn small" id="refresh-btn" data-i18n="ctrl.refresh">Refresh Scan</button>
          <button class="btn small secondary" id="sender-rules-btn" data-i18n="ctrl.sender_rules" data-i18n-title="ctrl.sender_rules_title" title="View, search, and bulk-manage learned sender rules">Sender Rules</button>
          <button class="btn small secondary" id="audit-log-btn" data-i18n="ctrl.audit_log" data-i18n-title="ctrl.audit_log_title" title="Inspect recent triage batches and restore archived messages to Inbox">Audit Log</button>
          <button class="btn small secondary" id="settings-btn" data-i18n="ctrl.settings" data-i18n-title="ctrl.settings_title" title="Edit configuration settings">Settings</button>
          <button class="btn small secondary" id="help-btn" data-i18n="ctrl.guide" data-i18n-title="ctrl.guide_title" title="Open Nollpost Quick Guide">? Guide</button>
        </div>
      </div>

      <div class="exec-bar">
        <div class="batch-summary" id="batch-summary" data-i18n="batch.loading">Loading mailboxes…</div>
        <div class="exec-buttons">
          <button class="btn secondary" id="btn-reset-actions" data-i18n="btn.reset_actions" data-i18n-title="btn.reset_actions_title" title="Set all visible rows to No action" disabled>Reset Visible to No action</button>
          <button class="btn outline-accent" id="btn-exec-selected" disabled>Execute Selected (0)</button>
          <button class="btn secondary" id="btn-exec-category" data-i18n="btn.exec_category_initial" disabled>Execute Category (0)</button>
          <button class="btn primary" id="btn-exec-all" disabled>Execute All Actions (0)</button>
        </div>
      </div>

      <div class="tray hidden" id="safety-tray">
        <div id="tray-text"></div>
        <div class="tray-actions">
          <button class="btn small secondary" id="btn-tray-dismiss" data-i18n="tray.dismiss">Dismiss Tray</button>
          <button class="btn small primary" id="btn-tray-sweep" data-i18n="tray.sweep_initial">Review &amp; Sweep Opened…</button>
        </div>
      </div>

      <div class="auto-digest hidden" id="auto-digest-banner"></div>

      <div class="update-banner hidden" id="update-banner"></div>
    </header>

    <section class="filter-bar">
      <div class="tabs" id="category-tabs"></div>
      <div class="filter-right">
        <div class="tabs" id="account-tabs"></div>
        <div class="filter-control">
          <span class="filter-label" data-i18n="filter.group_label">Group:</span>
          <div class="group-toggle" id="group-by-toggle" role="group" data-i18n-title="filter.group_title" title="Group visible emails">
            <button type="button" class="tab active" data-group="sender" data-i18n="filter.group_sender">Sender</button>
            <button type="button" class="tab" data-group="category" data-i18n="filter.group_category">Category</button>
            <button type="button" class="tab" data-group="none" data-i18n="filter.group_none">None</button>
          </div>
        </div>
        <div class="filter-control">
          <label for="sort-by-select" class="filter-label" data-i18n="filter.sort_label">Sort:</label>
          <select id="sort-by-select" class="filter-select" data-i18n-title="filter.sort_title" title="Sort emails and groups">
            <option value="date_desc" data-i18n="filter.sort_date_desc" selected>Newest first</option>
            <option value="date_asc" data-i18n="filter.sort_date_asc">Oldest first</option>
            <option value="sender_asc" data-i18n="filter.sort_sender_asc">Sender (A-Z)</option>
            <option value="subject_asc" data-i18n="filter.sort_subject_asc">Subject (A-Z)</option>
            <option value="count_desc" data-i18n="filter.sort_count_desc">Most messages</option>
            <option value="unread_first" data-i18n="filter.sort_unread_first">Unread first</option>
          </select>
        </div>
        <label class="toggle-check">
          <input type="checkbox" id="unread-only-toggle" />
          <span data-i18n="filter.unread_only">Unread only</span>
        </label>
        <input type="search" id="search-input" class="search-box" data-i18n-placeholder="filter.search_placeholder" placeholder="Search sender or subject…" />
      </div>
    </section>

    <div id="progress-banner" class="progress-banner hidden"></div>
    <div id="results-banner" class="results-banner hidden"></div>

    <main id="queue-container" class="tbl-wrap">
      <div class="snabel-loader-card" role="status" aria-live="polite">
        <img src="/static/loading.svg" class="snabel-loader-svg" alt="Nollpost" width="72" height="72" />
        <div class="snabel-loader-title" id="scan-status-text" data-i18n="scan.starting">Starting Nollpost Review Board...</div>
      </div>
    </main>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modal-title" data-i18n="modal.confirmation_title">Confirmation Preview</h2>
        <span class="pill muted" data-i18n="modal.zero_delete_pill">0 emails will be deleted (Archive only)</span>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-foot">
        <button class="btn secondary" id="modal-cancel" data-i18n="modal.cancel">Cancel</button>
        <button class="btn primary" id="modal-confirm" data-i18n="modal.confirm_run">Confirm &amp; Run</button>
      </div>
    </div>
  </div>

  <!-- Snapshot Modal -->
  <div id="snapshot-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal wide">
      <div class="modal-head">
        <h2 id="snap-title" data-i18n="snap.default_title">Missed Unsubscribe Diagnostics</h2>
        <button class="btn small secondary" id="snap-close" data-i18n="snap.close">Close</button>
      </div>
      <div id="snap-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
